name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Step-level `if` cannot read the secrets context, so resolve it once here.
    env:
      HAS_AUTH_KEY: ${{ secrets.GPSPUSH_AUTH_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      # The Azure function key is never committed; it is baked into the APK here
      # from a repository secret. Without it the APK builds but uploads 401.
      - name: Build debug APK
        env:
          GPSPUSH_AUTH_KEY: ${{ secrets.GPSPUSH_AUTH_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Warn if the APK has no auth key
        if: env.HAS_AUTH_KEY != 'true'
        run: echo "::warning::GPSPUSH_AUTH_KEY secret is not set - this APK will get 401 from the Function App."

      # Debug-signed, so it installs on the phone with no extra steps.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gpspush-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
